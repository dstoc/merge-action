name: "Advance auto-merge queue"
description: "Rebase the oldest approved auto-merge PR onto the target branch"
inputs:
  pr-token:
    description: "Fine-grained PAT with Pull requests read/write"
    required: true
  base-branch:
    description: "Target branch"
    default: "main"
runs:
  using: composite
  steps:
    - name: Advance auto-merge queue
      shell: bash
      env:
        PR_GH_TOKEN: ${{ inputs.pr-token }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        MERGE_ACTION_PATH: ${{ github.action_path }}
      run: bash "$MERGE_ACTION_PATH/merge-worker.sh"
