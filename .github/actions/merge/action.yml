name: "Serial merge worker"
description: "Rebase approved pull requests, wait for CI, reapprove rebased commits, and squash-merge one at a time"
inputs:
  rebase-token:
    description: "Personal-account token used for branch updates and CI reads"
    required: true
  approve-token:
    description: "Separate review-bot token used for SHA-specific approvals and merges"
    required: true
  base-branch:
    description: "Target branch"
    default: "main"
  check-timeout:
    description: "Maximum time spent waiting for each PR's required checks"
    default: "30m"
runs:
  using: composite
  steps:
    - name: Merge approved pull requests
      shell: bash
      env:
        REBASE_GH_TOKEN: ${{ inputs.rebase-token }}
        APPROVE_GH_TOKEN: ${{ inputs.approve-token }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        CHECK_TIMEOUT: ${{ inputs.check-timeout }}
      run: bash "${{ github.action_path }}/merge-worker.sh"
